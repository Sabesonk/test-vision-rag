# docker-compose.yml — the local stack for trying the features that exist (Spec §15 Factor X).
#
# Same image as production and as the test stack, differing only in environment and ports: the
# stub VLM is selected by `VSIR_VLM=stub` (D10), so what you exercise here is the production code
# path replaying frozen responses. **It spends nothing.** Set `VSIR_VLM=gemini` only deliberately —
# see the `api` service's notes.
#
#   bash scripts/stack.sh up        build, start, create the collection, seed a document
#   bash scripts/stack.sh status    what is running and what is queryable
#   bash scripts/stack.sh down      stop and keep the data  ·  `down --wipe` to drop it
#
# Ports are deliberately unusual (6353, 8055). This machine already runs Qdrant on 6333/6334 and
# something on 8000, and a stack that quietly answered from the wrong instance is worse than one
# that will not start.
#
# Swagger UI is served by the app itself at http://localhost:8055/docs — no proxy and no sidecar.
# The document declares a `bearerAuth` requirement on every operation that has one, so paste a
# token into **Authorize** once and `Try it out` works for the rest of the session.
#
# What is servable at this release: POST /documents, POST /tools/lookup, POST /tools/verify,
# GET /runs/{run_id} and its two exports, the three probes, and MCP over SSE. `skim_*`, `resolve`,
# `fetch` and `read` return a typed 404 that lists what is there — they arrive with M4-M5.

name: vsir-dev

services:

  # ── Store ─────────────────────────────────────────────────────────────────────────────────────
  qdrant:
    # The same version as the test stack and production: `phrase_matching` needs 1.19 (§4.2), and
    # a store that differs between environments is a correctness difference, not a convenience.
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6353:6333"      # 6353, because 6333/6334 already belong to another instance
    volumes:
      - qdrant-storage:/qdrant/storage
    networks: [vsir-net]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ── One-off: create the collection (§15 Factor XII) ───────────────────────────────────────────
  init:
    # `vsir serve` refuses to start when the live payload schema does not match `INDEXED` (§4.3,
    # I6), and "does not exist" does not match — so on a fresh volume the collection has to be
    # built before the server can boot. It is an admin process of the same image and release, not
    # a branch inside the server, which is the whole of Factor XII.
    build: &image
      context: ./backend
      dockerfile: Dockerfile
    image: vsir:dev
    command: ["doctor", "--create-collection"]
    environment: &env
      VSIR_PORT: "8000"
      VSIR_QDRANT_URL: "http://qdrant:6333"
      VSIR_COLLECTION: "vsir_pages"
      VSIR_VLM: "${VSIR_VLM:-stub}"
      VSIR_VLM_MODEL: "${VSIR_VLM_MODEL:-gemini-3.8-flash}"
      VSIR_EMBED_MODEL: "${VSIR_EMBED_MODEL:-gemini-embedding-2}"
      # Interpolated like VSIR_VLM above, and for the same reason: replay must key on the
      # version the checked-in fixtures were frozen under (s2-v1), while a live run needs
      # the version this release actually ships. `scripts/stack.sh up --live` exports the
      # latter; the default here keeps the free stack replaying.
      VSIR_PROMPT_VERSION: "${VSIR_PROMPT_VERSION:-s2-v1}"
      # The **same** variable the CLI and a direct `vsir serve` read, so there is one token for one
      # machine. `docker-compose.test.yml` deliberately reads a *different* name
      # (`VSIR_TEST_API_TOKENS`) because its suites assert about the credential the container was
      # handed, and picking up a developer's real one made that assertion meaningless. That reason
      # does not apply here, and copying it split the answer to "which token?" in two: `.env` said
      # one thing and the container another, so whichever an operator reached for, one of them 401'd.
      VSIR_API_TOKENS: "${VSIR_API_TOKENS:-dev-token-not-a-secret}"
      VSIR_READ_QUOTA: "50"
      # A live model bills S1, S2 and one embedding per page. `POST /documents` refuses
      # `403 spend_not_permitted` while this is 0 and the release names a live backend, which is
      # the one place the variable decides anything.
      VSIR_ALLOW_PAID: "${VSIR_ALLOW_PAID:-0}"
      VSIR_LOG_LEVEL: "${VSIR_LOG_LEVEL:-INFO}"
      VSIR_RELEASE_ID: "dev"
      # Absolute, because the ingest child's working directory is the server's and a relative path
      # resolves against that rather than against the caller's idea of the repository root. The
      # route refuses `400 fixture_not_found` naming what it tried, so this is not a silent trap.
      VSIR_FIXTURE: "/srv/data/fixtures/synthetic_3window"
      # The document store (§4.2, U029): the named volume below, so the SOURCE pdf a page raster is
      # rendered from survives `stack.sh down` and a container restart. Rasters are still never
      # persisted — they are re-rendered on demand into an in-process LRU — but until this volume
      # existed there was nothing to re-render them *from*: an upload's spool died with the
      # container and `page_id` resolved to no bytes at all. Every process type of the release
      # mounts the same one, which is what makes the answer independent of which replica serves it.
      VSIR_DOC_STORE: "/srv/documents"
      # Only read when VSIR_VLM=gemini. Absent from the image and from this file: it arrives from
      # the environment, and never appears in a log line or a response (§15.1).
      VSIR_VLM_KEY: "${VSIR_VLM_KEY:-}"
    volumes: &data
      # Read-only: the corpus and the frozen fixtures are inputs. Nothing in the pipeline writes
      # here — the exports stream from the index and touch no filesystem (§6.8).
      - ./data:/srv/data:ro
      # Writable, and the only writable path outside the tmpfs: the source documents. `init` gets
      # it too because the anchor is shared and a `doctor` run that never writes there is harmless
      # — one mount list for every process type is worth more than trimming one of them.
      #
      # **A host directory rather than a named volume**, so the ingested PDFs are visible and
      # manageable where the operator actually works. A named volume is outside the image either
      # way, but on macOS and Windows it lives inside the Docker VM — so "where did my document
      # go?" had no answer a person could `ls`, and putting a corrected PDF in place meant a
      # round trip through `docker cp`. Override the location with `VSIR_DOCUMENTS_DIR`.
      #
      # On Linux the container's uid (10001) must be able to write it: the image `chown`s
      # `/srv/documents` at build, but a bind mount shadows that, so run
      # `sudo chown -R 10001:10001 var/documents` once. Docker Desktop maps the writes for you.
      - ${VSIR_DOCUMENTS_DIR:-./var/documents}:/srv/documents
    networks: [vsir-net]
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  # ── Web ───────────────────────────────────────────────────────────────────────────────────────
  api:
    build: *image
    image: vsir:dev
    # The image's ENTRYPOINT is `vsir`, so `web` is a subcommand of the same binary the one-off
    # admin commands run. Not a `uvicorn` invocation: the boot self-check runs inside `vsir serve`
    # before anything binds, so a misconfigured stack fails to start rather than serving (§4.3).
    command: ["serve"]
    environment: *env
    volumes: *data
    ports:
      - "127.0.0.1:8055:8000"
    networks: [vsir-net]
    # Production runs read-only, so this does too: a container that only works with a writable
    # root filesystem is not the one being shipped (§15 Factor V).
    read_only: true
    tmpfs:
      # Rasters are re-rendered on demand and are never a source of truth (§4.2) — and this is
      # also where `POST /documents` spools an upload for the life of one run, which is why it is
      # larger than the test stack's 512m. The spool dying with the container costs nothing now:
      # step 02 deposits the document in the host document directory mounted above, so
      # `vsir ingest --resume <run_id>` continues an uploaded run with no path at all (U029).
      - /tmp:rw,noexec,nosuid,size=2g
    depends_on:
      qdrant:
        condition: service_healthy
      init:
        # Not "started": the collection has to exist before the boot self-check reads it.
        condition: service_completed_successfully
    healthcheck:
      # Liveness, not readiness: `/health` must stay green through a Qdrant outage, or the
      # orchestrator restart-loops a process whose backing service is the thing that is down
      # (§15.1). `/ready` is the one that goes red — `scripts/stack.sh status` reads both.
      test: ["CMD", "python", "-c",
             "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ── One-off: put a document in the index so there is something to query ───────────────────────
  seed:
    build: *image
    image: vsir:dev
    # The generated 42-page corpus, replayed from its frozen fixture: three windows, two scanned
    # pages, a section straddling each fold, and the off-by-one, crop and reattribution traps.
    # Free and deterministic — a fixture miss is a typed `fixture_miss`, never a live call (D10).
    command: ["ingest", "/srv/data/source/synthetic_3window.pdf",
              "--vlm", "stub", "--fixture", "/srv/data/fixtures/synthetic_3window"]
    environment: *env
    volumes: *data
    networks: [vsir-net]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    depends_on:
      init:
        condition: service_completed_successfully
    restart: "no"

  # ── Console: the React app of U023, same-origin with the API through vite's proxy ────────────
  console:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Never `latest` (§15.2) — the tag is the release, and this stack's release is `dev`.
    image: vsir-console:dev
    environment:
      # A **proxy target**, not a base URL a browser ever sees. `vite.config.ts` forwards the API
      # paths so the console is same-origin with the service: no CORS boundary, and a relative
      # `image.url` resolves against the origin that served the page. `api` resolves only on
      # `vsir-net`, which is correct for a proxy and unreachable from the host (§15 Factor III).
      VITE_API_URL: http://api:8000
    ports:
      # 5173 is dev's, as `docker-compose.test.yml` says in its own comment — the test stack takes
      # 5174 so both can be up at once. The variable is for the developer machine that already has
      # something on this port; a stack that cannot start is a stack nobody runs.
      - "127.0.0.1:${VSIR_CONSOLE_PORT:-5173}:5173"
    networks: [vsir-net]
    read_only: true
    tmpfs:
      # Vite bundles its **TypeScript** config to `node_modules/.vite-temp/` before reading it, so
      # `vite preview` needs that one path writable and nothing else — which keeps the rest of the
      # bundle read-only to the process serving it (§15 Factor V).
      #
      # `uid`/`gid` are not decoration. A tmpfs mounts **root-owned**, which silently replaces the
      # `chown node:node` the Dockerfile does on this very path, and `vite preview` then exits
      # `EACCES` on a file no test names. 1000 is the base image's `node` user. The test stack
      # does not hit this because it does not run the console read-only.
      - /app/node_modules/.vite-temp:rw,size=64m,uid=1000,gid=1000
    healthcheck:
      # node, not curl: this base image ships no shell utilities it does not need, the same
      # reason the backend probe uses python.
      test: ["CMD", "node", "-e",
             "require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      api:
        # The proxy target has to answer, or the first page load is a 502 the operator has to
        # guess at. `api`'s healthcheck is liveness, which is the right bar here.
        condition: service_healthy

networks:
  vsir-net:
    driver: bridge

volumes:
  qdrant-storage:
    # Named, so the index survives `stack.sh down` and a machine restart. `down --wipe` is the
    # only thing that drops it, and it says so before it does.
  # The source PDFs (§4.2, U029) are **not** here any more: they live in the host directory
  # `VSIR_DOCUMENTS_DIR` names, mounted above. The invariant that moved with them is the one
  # `down --wipe` keeps — dropping the index and leaving the documents would leave a store
  # describing a corpus that is no longer indexed — so `scripts/stack.sh` now empties that
  # directory in the same breath as it drops this volume. Losing the documents costs page images,
  # never an answer: the index is the source of truth for retrieval, and a missing document is a
  # typed `document_not_stored` rather than a wrong result.
